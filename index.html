<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubbles</title>
<style>
  @property --bg-top    { syntax: "<color>"; inherits: true; initial-value: #0b1d3a; }
  @property --bg-bottom { syntax: "<color>"; inherits: true; initial-value: #1d6f8f; }
  :root {
    transition: --bg-top 3s ease, --bg-bottom 3s ease;
    --bg-top: hsl(215 60% 12%);
    --bg-bottom: hsl(195 55% 42%);
    --ink: #f4fbff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(to top, var(--bg-bottom), var(--bg-top));
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
  }

  /* ---------- bubbles ---------- */
  .bubble {
    position: absolute;
    left: 0; top: 0;
    border-radius: 50%;
    cursor: pointer;
    will-change: transform;
    box-shadow: 0 0 18px rgba(160,230,255,.25);
    border: 1px solid rgba(255,255,255,.35);
    transition: filter .3s, box-shadow .3s;
  }
  /* optional featured image, semi-transparent and faded toward the rim */
  .bubble-img {
    position: absolute; inset: 0;
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    opacity: .5;
    -webkit-mask-image: radial-gradient(circle, #000 55%, transparent 100%);
            mask-image: radial-gradient(circle, #000 55%, transparent 100%);
    pointer-events: none;
    transition: opacity .3s;
  }
  .bubble:hover .bubble-img, .bubble.paused .bubble-img { opacity: .7; }
  /* title shown inside the bubble on hover, wrapped to the circle */
  .bubble-title {
    position: absolute;
    left: 50%; top: 50%;
    width: 68%;
    transform: translate(-50%, -50%);
    font-size: var(--fs, 16px);
    letter-spacing: .04em;
    line-height: 1.15;
    text-align: center;
    text-wrap: balance;
    overflow-wrap: break-word;
    text-shadow: 0 1px 8px rgba(0,0,0,.65);
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    z-index: 1;
  }
  .bubble:hover .bubble-title, .bubble.paused .bubble-title { opacity: 1; }
  /* glass layer sits above the image */
  .bubble::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    pointer-events: none;
    background:
      radial-gradient(circle at 30% 28%, rgba(255,255,255,.85) 0 4%, transparent 14%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.04) 55%, rgba(160,230,255,.28) 78%, rgba(255,150,230,.35) 92%, rgba(255,255,255,.55) 100%);
    box-shadow:
      inset 0 0 18px rgba(255,255,255,.35),
      inset -10px -14px 30px rgba(255,120,220,.25),
      inset 10px 12px 30px rgba(110,220,255,.25);
  }
  .bubble:hover, .bubble.paused {
    filter: brightness(1.25) saturate(1.3);
    box-shadow: 0 0 34px rgba(190,240,255,.55);
  }
  .bubble.hidden { visibility: hidden; pointer-events: none; }

  /* ---------- pop effect ---------- */
  .pop-ring {
    position: fixed;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.8);
    pointer-events: none;
    animation: ring .6s ease-out forwards;
  }
  @keyframes ring {
    from { transform: scale(.9); opacity: 1; }
    to   { transform: scale(1.5); opacity: 0; border-width: 0; }
  }
  .droplet {
    position: fixed;
    width: 10px; height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: rgba(220,245,255,.9);
    pointer-events: none;
    animation: droplet .7s ease-out forwards;
  }
  @keyframes droplet {
    to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
  }

  /* ---------- reveal overlay ---------- */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(5, 15, 35, 0);
    pointer-events: none;
    transition: background 1.2s;
    z-index: 10;
  }
  #overlay.active { background: rgba(5, 15, 35, .72); pointer-events: auto; }

  #title {
    position: fixed;
    left: 0; top: 0;
    margin: 0;
    font-weight: normal;
    letter-spacing: .04em;
    line-height: 1.15;
    text-align: center;
    text-wrap: balance;
    overflow-wrap: break-word;
    opacity: 0;
    z-index: 11;
    pointer-events: none;
    text-shadow: 0 2px 20px rgba(0,0,0,.4);
    will-change: transform, opacity;
  }

  #description {
    position: fixed;
    left: 50%; top: 50%;
    width: min(680px, 90vw);
    max-height: calc(50vh - 3rem);
    overflow-y: auto;
    /* sits below the title, which rests at the centre */
    transform: translate(-50%, 2.5rem);
    padding: 0 .5rem;
    font-size: 1.1rem;
    line-height: 1.65;
    text-align: center;
    opacity: 0;
    transition: opacity 1.4s ease;
    z-index: 11;
    pointer-events: none;
  }
  #description.show { opacity: 1; pointer-events: auto; }
  #description img {
    display: block;
    max-width: 100%;
    max-height: 32vh;
    margin: 1rem auto;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  #description p { margin: 0 0 1rem; }

  #close {
    position: fixed;
    top: 1rem; right: 1.25rem;
    z-index: 12;
    background: none; border: 1px solid rgba(255,255,255,.5);
    color: var(--ink);
    width: 2.5rem; height: 2.5rem;
    border-radius: 50%;
    font-size: 1.4rem; line-height: 1;
    cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity .6s, background .2s;
  }
  #close.show { opacity: 1; pointer-events: auto; }
  #close:hover { background: rgba(255,255,255,.15); }

  /* ---------- static layout: list on mobile, grid on desktop ---------- */
  #layout-toggle {
    position: fixed;
    top: 1rem; right: 1.25rem;
    z-index: 9;
    width: 2.5rem; height: 2.5rem;
    padding: 0;
    display: grid; place-items: center;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 50%;
    color: var(--ink);
    cursor: pointer;
    transition: background .2s;
  }
  #layout-toggle:hover { background: rgba(255,255,255,.2); }
  #layout-toggle svg { width: 1.2rem; height: 1.2rem; }
  #layout-toggle .icon-float { display: none; }
  .static-mode #layout-toggle .icon-float { display: block; }
  .static-mode #layout-toggle .icon-grid { display: none; }

  #grid { display: none; }
  .static-mode, .static-mode body { height: auto; min-height: 100%; overflow-y: auto; }
  .static-mode body { background-attachment: fixed; }
  .static-mode.focus-open, .static-mode.focus-open body { overflow: hidden; }
  .static-mode #grid {
    display: grid;
    grid-template-columns: 1fr;
    justify-items: center;
    gap: 2rem;
    padding: 5rem 1.25rem 3rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (min-width: 700px) {
    .static-mode #grid {
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 2.5rem 1.5rem;
    }
  }
  .static-mode .bubble {
    position: relative;
    transform: none !important;
    width: 240px !important;
    height: 240px !important;
    --fs: 24px !important;
  }
  .static-mode .bubble-title { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    :root { transition: none; }
    .pop-ring, .droplet { animation-duration: .01s; }
  }
</style>
</head>
<body>

<div id="overlay"></div>
<h2 id="title"></h2>
<div id="description"></div>
<button id="layout-toggle" aria-pressed="false" aria-label="Switch to grid layout" title="Switch layout">
  <svg class="icon-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
    <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
    <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
  </svg>
  <svg class="icon-float" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
    <circle cx="8" cy="15.5" r="5"/><circle cx="16.5" cy="7" r="3.5"/>
  </svg>
</button>
<div id="grid"></div>
<button id="close" aria-label="Close">&times;</button>

<script>
/* ======================================================
   CONTENT — edit this list. `body` is plain HTML, so it
   can mix paragraphs, images, links, etc. `image` is an
   optional featured image shown faintly inside the bubble.
   ====================================================== */
const ITEMS = [
  {
    title: "Soap & Surface Tension",
    image: "Tester",
    body: `<p>A bubble is a thin film of water sandwiched between two layers of soap molecules. Surface tension pulls it into a sphere, the shape with the least surface for its volume.</p>
           <img src="https://picsum.photos/seed/soap/800/450" alt="Soap bubbles">`
  },
  {
    title: "Rainbow Colours",
    image: "https://picsum.photos/seed/rainbow/600/600",
    body: `<p>The swirling colours come from light reflecting off the front and back of the film. As the film thins, different wavelengths cancel and reinforce each other.</p>
           <img src="https://picsum.photos/seed/rainbow/800/450" alt="Colourful reflections">`
  },
  {
    title: "Why They Pop",
    body: `<p>Evaporation and gravity slowly thin the top of the film until it can no longer hold together. Touch is quicker: dry fingers break the film instantly.</p>`
  },
  {
    title: "Giant Bubbles",
    image: "https://picsum.photos/seed/giant/600/600",
    body: `<p>Add a little glycerin or corn syrup to the mixture and the film lasts far longer, letting street performers build bubbles taller than a person.</p>
           <img src="https://picsum.photos/seed/giant/800/450" alt="A giant bubble">`
  },
  {
    title: "Bubbles in Art",
    body: `<p>From Dutch <em>vanitas</em> paintings to modern installations, bubbles have long stood for beauty that is fragile and fleeting.</p>`
  },
  {
    title: "Underwater",
    image: "https://picsum.photos/seed/underwater/600/600",
    body: `<p>Divers' bubbles expand as they rise, because the water pressure around them falls. The same effect is why a fizzy drink foams when opened.</p>
           <img src="https://picsum.photos/seed/underwater/800/450" alt="Underwater bubbles">`
  },
  {
    title: "Foam",
    body: `<p>When bubbles cluster they meet at 120° angles, forming the honeycomb-like structure you see in a bath or a pint of beer.</p>`
  }
];

/* ======================================================
   SETTINGS
   ====================================================== */
const MIN_SIZE = 200;          // px
const MAX_SIZE_FRAC = 0.20;    // of page width
const MIN_SPEED = 18;          // px / second
const MAX_SPEED = 42;
/* Background: mouse X sets the hue, mouse Y sets the lightness.
   The top colour stays dark and the bottom stays light; each has its own limits. */
const HUE_MIN = 190, HUE_MAX = 300;          // x: left → right
const TOP_L_MIN = 6,  TOP_L_MAX = 20;        // y: top → bottom, lightness % of the top stop
const BOTTOM_L_MIN = 30, BOTTOM_L_MAX = 55;  // same for the bottom stop
const BG_SAT = 58;                           // saturation %
const BG_HUE_SHIFT = -15;                    // bottom stop hue offset, for a little depth
const BG_DEBOUNCE_MS = 500;                  // apply only after the pointer has been still this long
const BG_THROTTLE_MS = 2000;                 // and no more often than this

const TITLE_TRAVEL_MS = 2800;  // how slowly the title glides to centre
const UNWRAP_MS = 700;         // title widens to a single line before it starts to grow
const DESC_DELAY_MS = 300;     // pause after arriving before description fades in

/* ======================================================
   BUBBLES
   ====================================================== */
const rand = (a, b) => a + Math.random() * (b - a);
const bubbles = [];

function maxSize() {
  // 20% of page width, but never below the 200px minimum
  return Math.max(MIN_SIZE, window.innerWidth * MAX_SIZE_FRAC);
}

function bubbleFontSize(size) { return Math.round(size * 0.1); }

function randomiseBubble(b, startAnywhere) {
  const max = maxSize();
  b.size = rand(MIN_SIZE, max);
  b.speed = rand(MIN_SPEED, MAX_SPEED);
  b.wobbleAmp = rand(8, 30);
  b.baseX = rand(b.wobbleAmp, Math.max(b.wobbleAmp, window.innerWidth - b.size - b.wobbleAmp));
  b.wobbleFreq = rand(0.3, 0.8);
  b.phase = rand(0, Math.PI * 2);
  b.t = 0;
  b.y = startAnywhere
    ? rand(-b.size, window.innerHeight)
    : window.innerHeight + rand(0, 80);
  b.el.style.width = b.el.style.height = b.size + "px";
  b.el.style.setProperty("--fs", bubbleFontSize(b.size) + "px");
}

ITEMS.forEach((item, i) => {
  const el = document.createElement("div");
  el.className = "bubble";
  el.setAttribute("role", "button");
  el.setAttribute("tabindex", "0");
  el.setAttribute("aria-label", "Pop bubble " + (i + 1));
  if (item.image) {
    const img = document.createElement("div");
    img.className = "bubble-img";
    img.style.backgroundImage = `url("${item.image}")`;
    el.appendChild(img);
  }
  const label = document.createElement("div");
  label.className = "bubble-title";
  label.textContent = item.title;
  el.appendChild(label);
  document.body.appendChild(el);

  const b = { el, item, hovered: false, popped: false };
  randomiseBubble(b, true);
  // spread initial positions out so they don't all start in a clump
  b.y = window.innerHeight - (i / ITEMS.length) * (window.innerHeight + 200) * 1.0 + rand(-40, 40);

  el.addEventListener("pointerenter", () => b.hovered = true);
  el.addEventListener("pointerleave", () => b.hovered = false);
  el.addEventListener("focus", () => b.hovered = true);
  el.addEventListener("blur", () => b.hovered = false);
  el.addEventListener("click", () => pop(b));
  el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pop(b); }
  });

  bubbles.push(b);
});

const bg = { x: 0.5, y: 0.5 };
const lerp = (a, b, t) => a + (b - a) * t;

function applyBackground() {
  const hue  = Math.round(lerp(HUE_MIN, HUE_MAX, bg.x));
  const topL = Math.round(lerp(TOP_L_MIN, TOP_L_MAX, bg.y));
  const botL = Math.round(lerp(BOTTOM_L_MIN, BOTTOM_L_MAX, bg.y));
  const root = document.documentElement.style;
  root.setProperty("--bg-top", `hsl(${hue} ${BG_SAT}% ${topL}%)`);
  root.setProperty("--bg-bottom", `hsl(${hue + BG_HUE_SHIFT} ${BG_SAT}% ${botL}%)`);
}

// Debounce: wait until the pointer has been still for BG_DEBOUNCE_MS.
// Throttle: then apply at most once every BG_THROTTLE_MS.
let bgDebounce = null, bgPending = null, bgLastApplied = -Infinity;
window.addEventListener("pointermove", e => {
  bg.x = Math.min(1, Math.max(0, e.clientX / window.innerWidth));
  bg.y = Math.min(1, Math.max(0, e.clientY / window.innerHeight));
  clearTimeout(bgDebounce);
  bgDebounce = setTimeout(() => {
    if (bgPending) return;                     // a throttled update is already queued; it reads the latest values
    const wait = Math.max(0, BG_THROTTLE_MS - (performance.now() - bgLastApplied));
    bgPending = setTimeout(() => {
      bgPending = null;
      bgLastApplied = performance.now();
      applyBackground();
    }, wait);
  }, BG_DEBOUNCE_MS);
});
applyBackground();

/* ---------- layout mode: floating bubbles vs. static list/grid ---------- */
const reduceMQ = window.matchMedia("(prefers-reduced-motion: reduce)");
const grid = document.getElementById("grid");
const layoutBtn = document.getElementById("layout-toggle");
let staticMode = false;

function setStaticMode(on) {
  staticMode = on;
  document.documentElement.classList.toggle("static-mode", on);
  layoutBtn.setAttribute("aria-pressed", String(on));
  layoutBtn.setAttribute("aria-label", on ? "Switch to floating bubbles" : "Switch to grid layout");
  for (const b of bubbles) {
    (on ? grid : document.body).appendChild(b.el);
    b.hovered = false;
    b.el.classList.remove("paused");
    if (!on) b.el.style.transform = ""; // the loop takes over again
  }
  window.scrollTo(0, 0);
}
layoutBtn.addEventListener("click", () => setStaticMode(!staticMode));
reduceMQ.addEventListener("change", e => setStaticMode(e.matches));
if (reduceMQ.matches) setStaticMode(true);

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); // clamp after tab switches
  last = now;
  if (staticMode) { requestAnimationFrame(frame); return; }

  for (const b of bubbles) {
    if (!b.popped && !b.hovered) {
      b.y -= b.speed * dt;
      b.t += dt;
      if (b.y < -b.size) {          // floated off the top → back to bottom
        randomiseBubble(b, false);
      }
    }
    const x = b.baseX + Math.sin(b.t * b.wobbleFreq * Math.PI * 2 + b.phase) * b.wobbleAmp;
    b.el.style.transform = `translate3d(${x}px, ${b.y}px, 0)`;
    b.el.classList.toggle("paused", b.hovered);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.addEventListener("resize", () => {
  const max = maxSize();
  for (const b of bubbles) {
    if (b.size > max) {
      b.size = max;
      b.el.style.width = b.el.style.height = max + "px";
      b.el.style.setProperty("--fs", bubbleFontSize(max) + "px");
    }
    b.baseX = Math.min(b.baseX, Math.max(0, window.innerWidth - b.size));
  }
});

/* ======================================================
   POP + REVEAL
   ====================================================== */
const overlay = document.getElementById("overlay");
const titleEl = document.getElementById("title");
const descEl  = document.getElementById("description");
const closeBtn = document.getElementById("close");
let current = null;
let timers = [];

function burst(cx, cy, size) {
  const ring = document.createElement("div");
  ring.className = "pop-ring";
  ring.style.cssText = `left:${cx - size / 2}px;top:${cy - size / 2}px;width:${size}px;height:${size}px`;
  document.body.appendChild(ring);
  setTimeout(() => ring.remove(), 700);

  const n = 16;
  for (let i = 0; i < n; i++) {
    const d = document.createElement("div");
    d.className = "droplet";
    const ang = (i / n) * Math.PI * 2 + rand(-0.2, 0.2);
    const dist = size / 2 * rand(0.9, 1.4);
    d.style.left = cx + Math.cos(ang) * size / 2 * 0.8 + "px";
    d.style.top  = cy + Math.sin(ang) * size / 2 * 0.8 + "px";
    d.style.setProperty("--dx", Math.cos(ang) * dist * 0.5 + "px");
    d.style.setProperty("--dy", Math.sin(ang) * dist * 0.5 + "px");
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 800);
  }
}

function pop(b) {
  if (current) return;
  current = b;
  b.popped = true;
  b.hovered = false;

  const r = b.el.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;

  b.el.classList.add("hidden");
  burst(cx, cy, r.width);

  // title starts exactly as the in-bubble label (same size, width and wrapping),
  // then glides to the centre while widening and growing to the focus size
  const centre = `translate(${window.innerWidth / 2}px, ${window.innerHeight / 2}px) translate(-50%, -50%)`;
  titleEl.textContent = b.item.title;
  titleEl.style.transition = "none";
  titleEl.style.opacity = "1";
  titleEl.style.whiteSpace = "normal";
  titleEl.style.width = r.width * 0.68 + "px";
  titleEl.style.fontSize = bubbleFontSize(r.width) + "px";
  // measure the single-line width at the starting font size
  titleEl.style.whiteSpace = "nowrap";
  titleEl.style.width = "max-content";
  const oneLine = titleEl.offsetWidth + 2;
  titleEl.style.whiteSpace = "normal";
  titleEl.style.width = r.width * 0.68 + "px";
  titleEl.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
  void titleEl.offsetWidth; // commit start state

  document.documentElement.classList.add("focus-open");
  overlay.classList.add("active");
  // phase 1: widen in place until the title is a single line
  const unwrapMs = reduceMQ.matches ? 0 : UNWRAP_MS;
  const travelMs = reduceMQ.matches ? 0 : TITLE_TRAVEL_MS;
  titleEl.style.transition = `width ${unwrapMs}ms ease`;
  titleEl.style.width = Math.max(oneLine, r.width * 0.68) + "px";

  // phase 2: lock to one line, then glide to the centre while growing
  timers.push(setTimeout(() => {
    titleEl.style.whiteSpace = "nowrap";
    titleEl.style.width = "max-content";
    const ease = `${travelMs}ms cubic-bezier(.45,.05,.25,1)`;
    titleEl.style.transition = `transform ${ease}, font-size ${ease}`;
    titleEl.style.fontSize = Math.max(32, Math.min(window.innerWidth * 0.05, 64)) + "px";
    titleEl.style.transform = centre;
  }, unwrapMs));

  descEl.innerHTML = b.item.body;
  descEl.scrollTop = 0;

  timers.push(setTimeout(() => {
    descEl.classList.add("show");
    closeBtn.classList.add("show");
  }, unwrapMs + travelMs + DESC_DELAY_MS));
}

function close() {
  if (!current) return;
  timers.forEach(clearTimeout); timers = [];
  const b = current;
  current = null;

  descEl.classList.remove("show");
  closeBtn.classList.remove("show");
  overlay.classList.remove("active");
  document.documentElement.classList.remove("focus-open");
  titleEl.style.transition = "opacity 500ms ease";
  titleEl.style.opacity = "0";

  // the bubble re-forms at the bottom and starts floating again
  setTimeout(() => {
    if (!staticMode) randomiseBubble(b, false);
    b.popped = false;
    b.el.classList.remove("hidden");
  }, 500);
}

overlay.addEventListener("click", close);
closeBtn.addEventListener("click", close);
window.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

window.addEventListener("resize", () => {
  if (current && titleEl.style.opacity === "1") {
    titleEl.style.transition = "none";
    titleEl.style.transform =
      `translate(${window.innerWidth / 2}px, ${window.innerHeight / 2}px) translate(-50%, -50%)`;
  }
});
</script>
</body>
</html>
